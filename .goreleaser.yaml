# goreleaser v2
#   check:          goreleaser check
#   local build:    goreleaser release --snapshot --clean --skip=publish
#   real release:   git tag v0.1.0 && git push --tags   (.github/workflows/release.yml)
version: 2
project_name: zvt-bridge

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...
    # Icon, version information and manifest of zvt-bridge.exe
    - go tool go-winres make --in winres/winres.json --out cmd/zvt-bridge/rsrc --arch amd64,arm64 --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }} --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}

builds:
  - id: zvt-bridge
    main: ./cmd/zvt-bridge
    binary: zvt-bridge
    env: [CGO_ENABLED=0]
    goos: [windows, linux]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: windows
        goarch: arm
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: fakept
    main: ./cmd/fakept
    binary: fakept
    env: [CGO_ENABLED=0]
    goos: [windows, linux]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: windows
        goarch: arm
    ldflags: ["-s -w"]
  - id: fakeecr
    main: ./cmd/fakeecr
    binary: fakeecr
    env: [CGO_ENABLED=0]
    goos: [windows, linux]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: windows
        goarch: arm
    ldflags: ["-s -w"]

archives:
  # The Windows installer (Inno Setup) is built from the windows_amd64 zip by
  # the "installer" job in .github/workflows/release.yml.
  - id: default
    ids: [zvt-bridge, fakept, fakeecr]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - linux/*

checksum:
  name_template: checksums.txt

release:
  github:
    owner: KSauter
    name: zvt-bridge
  prerelease: auto
  draft: false

snapshot:
  version_template: "{{ incpatch .Version }}-dev.{{ .ShortCommit }}"

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
