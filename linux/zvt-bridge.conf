# zvt-bridge configuration (Linux example)
# Keys are the options of 'zvt-bridge run'. Lines starting with # are comments.
# After changes: sudo systemctl restart zvt-bridge

# Payment terminal: IP address or host name, with the ZVT port (default 20007).
terminal = 192.168.1.50:20007

# Serial port towards the cash register (or use "usb = true" with vhci-hcd, see README).
serial = /dev/ttyUSB0
baud = 9600
stopbits = 2
parity = none

# Protocol timing.
ack-timeout = 2s
retries = 3
dial-timeout = 5s

# Log file (rotated at 5 MB, 3 files kept). v = true logs every byte.
log = /var/log/zvt-bridge/zvt-bridge.log
v = false
